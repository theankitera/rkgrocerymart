<script>
/* Dark Reader shield (dynamic): lock only while this page renders its own dark
   theme, so the extension never double-inverts our dark styles — yet still
   darkens the page for users who keep the site in light mode. Runs before any
   stylesheet is parsed so the meta exists when the extension scans the page. */
(function(){
  try{
    var saved=localStorage.getItem('rk_theme');
    var dark=(saved==='dark')||(saved!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    var sync=function(){
      var isDark=document.documentElement.getAttribute('data-theme')==='dark';
      var lock=document.head.querySelector('meta[name="darkreader-lock"]');
      if(isDark&&!lock){var m=document.createElement('meta');m.name='darkreader-lock';document.head.appendChild(m);}
      else if(!isDark&&lock){lock.remove();}
    };
    sync();
    new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }catch(e){}
})();
</script>
