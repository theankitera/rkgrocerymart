<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RK Grocery Mart">
  <defs>
    <linearGradient id="rkbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#rkbg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- shopping bag body -->
  <path d="M19 27 h26 c1.7 0 3 1.3 3 3 v18 c0 3.3 -2.7 6 -6 6 h-20 c-3.3 0 -6 -2.7 -6 -6 v-18 c0 -1.7 1.3 -3 3 -3 z" fill="#ffffff"/>
  <!-- bag handle -->
  <path d="M24.5 27 v-3 a7.5 7.5 0 0 1 15 0 v3" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- RK letters -->
  <text x="32" y="45.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#15803D" text-anchor="middle">RK</text>
  <!-- orange accent dot -->
  <circle cx="45.5" cy="20.5" r="3.2" fill="#F97316"/>
</svg>
